[package]
name = "event_base_grpc"
version = "0.2.0"
edition = "2024"
authors = ["RedElectricity <redelectricity@outlook.com>"]
description = "An Event Driven Framework - gRPC API Crate"
license = "BSD-3-Clause"
repository = "https://github.com/RedElectricity/event_base/event_base_grpc"
homepage = "https://github.com/RedElectricity/event_base/event_base_grpc"
documentation = "https://docs.rs/event_base"

[dependencies]
prost = "0.14.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-health = "0.14"
tonic-reflection = { version = "0.14", features = ["server"] }
event_base_core.workspace = true
serde_json = "1.0.150"

[features]
# Server TLS (rustls + ring) for `ServeConfig::tls` / `serve_tls`. Token auth
# (`ServeConfig::token`) is always available and needs no feature.
tls = ["tonic/tls-ring"]

[build-dependencies]
tonic-prost-build = "0.14.6"
