[package]
name = "event_base_macro_attr"
version = "0.3.4"
edition = "2024"
authors = ["RedElectricity <redelectricity@outlook.com>"]
description = "An Event Driven Framework - Attr Macro Crate"
license = "BSD-3-Clause"
repository = "https://github.com/RedElectricity/event_base"
homepage = "https://github.com/RedElectricity/event_base"
documentation = "https://docs.rs/event_base"

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
# The #[handler] expansion targets the `event_base` umbrella (`::event_base::core`
# and `linkme`), so doctests need it plus linkme in scope. Cyclic dev-deps are
# explicitly allowed by cargo.
event_base = { path = "..", version = "0.8.0", features = ["macro"] }
linkme = "0.3.36"
async-trait = "0.1.89"
