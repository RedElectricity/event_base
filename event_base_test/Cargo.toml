[package]
name = "event_base_test"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
event_base_core.workspace = true
event_base_queue.workspace = true
event_base_wal.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
bincode = "2.0.1"

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tempfile = "3.19.1"
event_base_grpc.workspace = true
tonic = "0.14.6"
prost = "0.14.4"

[features]
default = []
redis = ["event_base_queue/redis", "event_base_wal/redis"]

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "queue"
harness = false
